services:
  db:
    image: postgres:17-alpine
    container_name: gridsentinel-db
    environment:
      POSTGRES_USER: gridsentinel
      POSTGRES_PASSWORD: gridsentinel
      POSTGRES_DB: gridsentinel
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gridsentinel -d gridsentinel"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: